version: 2

models:
  - name: int_tasks_locations_weather_forecast
    description: >
      Joins each task to the weather hour(s) relevant to it, per the
      scheduled_at -> assigned_at -> posted_at priority in SPEC.md. One row
      per (task, matched hour) — a single row for scheduled/assigned tasks,
      up to 72 rows for the posted-only fallback. Tasks with an orphaned
      location or no matching hour in the fetched weather window still
      produce one row, with null scores. Not yet aggregated to one row per
      task — see fact_tasks_weather_risk for that.
    columns:
      - name: task_id
        description: FK to stg_tasks.
      - name: location_id
        description: FK to stg_locations. Null-valued weather columns if this doesn't resolve.
      - name: match_source
        description: Which task timestamp determined the window — 'scheduled', 'assigned', or 'posted'.
      - name: weather_time
        description: UTC hour of the matched weather row. Null if no hour in the task's window had data.
      - name: temp_score
        description: Temperature factor score, 1-3. Null if no weather matched.
      - name: precip_score
        description: Precipitation factor score, 1-3. Null if no weather matched.
      - name: wind_score
        description: Wind speed factor score, 1-3. Null if no weather matched.
      - name: visibility_score
        description: Visibility factor score, 1-3. Null if no weather matched.
      - name: label_rank
        description: Worst of the 4 factor scores for this hour (1=LOW, 2=MEDIUM, 3=HIGH). Null if no weather matched.
      - name: hourly_score
        description: Sum of the 4 factor scores for this hour, 4-12. Null if no weather matched.

unit_tests:
  []
