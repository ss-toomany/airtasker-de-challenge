version: 2

models:
  - name: stg_tasks
    description: >
      Staging model for tasks. Should deduplicate on task_id and cast/rename
      columns as needed. See README for known data quality issues.
    columns:
      - name: task_id
        description: Unique task identifier.
      - name: title
      - name: category
      - name: location_id
        description: FK to stg_locations. May reference locations that don't exist.
      - name: posted_at
        description: UTC timestamp of when the task was posted.
      - name: state
      - name: budget
      - name: assigned_at
        description: UTC timestamp of when the task was assigned. NULL for unassigned tasks.
      - name: scheduled_at
        description: UTC timestamp of when the work is scheduled. Present on assigned tasks only.

  - name: stg_locations
    description: >
      Staging model for locations (sourced from the raw_locations seed).
    columns:
      - name: location_id
        description: Unique location identifier.
      - name: city
      - name: country
        description: Country code — AU, US, or GB.
      - name: lat
      - name: lng
      - name: timezone
        description: IANA timezone string.

unit_tests:
  []
